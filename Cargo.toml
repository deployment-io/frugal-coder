[workspace]
members = ["crates/frugal-backend", "crates/frugal-agent", "crates/frugal-coder"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
frugal-backend = { path = "crates/frugal-backend" }

[workspace.lints.rust]
unsafe_code = "forbid"
